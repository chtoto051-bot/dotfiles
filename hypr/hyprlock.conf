background {
    monitor =
    path = /home/sano/Изображения/hyprland_chan.png
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(5b5b8cee)
    inner_color = rgba(181826aa)
    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    placeholder_text = <i>Пароль...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
